spring:
  application:
    name: spring-sec
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database: postgresql
    properties:
      hibernate:
        default_schema: ${SERVICE_SCHEME:rpr_user}



  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:32770/rpr3_ms_db}
    username: ${POSTGRES_USER:change-me}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVICE_PORT:8080}


ms:
  security:
    jwt:
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLWp3dC1zZWNyZXQtZm9yLWxvY2FsLXRlc3Q=}
      access-lifetime: ${JWT_ACCESS_LIFETIME:1d}
